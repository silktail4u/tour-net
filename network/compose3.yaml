services:

  router:
    build:
      context: .
      dockerfile: router.Dockerfile

    container_name: event-router

    network_mode: host
    privileged: true

    restart: unless-stopped

    environment:
      WAN_IF: eth0
      LAN_IF: wlp2s0
      LAN_IP: 10.50.0.1
      LAN_NET: 10.50.0.0/24

    volumes:
      - ./router-entrypoint.sh:/entrypoint.sh:ro

    command: ["/bin/sh", "/entrypoint.sh"]


  hostapd:
    build:
      context: .
      dockerfile: hostapd.Dockerfile

    container_name: event-wifi

    network_mode: host
    privileged: true

    restart: unless-stopped

    environment:
      EVENT_SSID: ${EVENT_SSID}
      EVENT_PASSWORD: ${EVENT_PASSWORD}

    volumes:
      - ./hostapd-entrypoint.sh:/entrypoint.sh:ro

    command: ["/bin/sh", "/entrypoint.sh"]


  dnsmasq:
    image: alpine:latest

    container_name: event-dns

    network_mode: host
    privileged: true

    restart: unless-stopped

    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro

    command:
      - dnsmasq
      - --keep-in-foreground
      - --conf-file=/etc/dnsmasq.conf


  caddy:
    image: caddy:latest

    container_name: event-caddy

    network_mode: host

    restart: unless-stopped

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config


volumes:
  caddy_data:
  caddy_config:
